apiVersion: batch/v1
kind: CronJob
metadata:
  name: financial-fraud-risk-pipeline
spec:
  schedule: "15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: financial-risk-pipeline
          securityContext:
            runAsNonRoot: true
          containers:
            - name: pipeline
              image: replace-me/financial-fraud-risk:1.0.0
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "2Gi"
              envFrom:
                - configMapRef:
                    name: financial-risk-config
                - secretRef:
                    name: financial-risk-secrets

