name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit and end-to-end tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run deterministic demo
        run: make PYTHON=python demo
      - name: Verify quality gate
        run: python -c "import json; assert json.load(open('data/processed/metrics/quality_report.json'))['metrics']['quality_gate'] == 'PASS'"

